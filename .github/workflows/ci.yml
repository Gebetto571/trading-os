name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Draft 2020-12 parity validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Install Research Engine test dependency
        run: python -m pip install --disable-pip-version-check -r research/engine/requirements.txt
      - name: Unit, integration, governance, and security tests
        run: python -m unittest discover -s tests -v
      - name: Research Engine package tests
        run: python -m unittest discover -s research/engine/tests -v
      - name: Whitespace check
        run: git diff --check

  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: trading_os_test
          POSTGRES_PASSWORD: trading_os_test
          POSTGRES_DB: trading_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_os_test -d trading_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://trading_os_test:trading_os_test@localhost:5432/trading_os_test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

  macos:
    name: Mac mini ARM64 safety smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Check shell entry points
        run: |
          for script in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done
      - name: Readiness, environment, test isolation, and backup failure cases
        run: python -m unittest discover -s tests -p test_system_operations.py -v
      - name: Setup preservation, activation, and rollback failure cases
        run: python -m unittest discover -s tests -p test_machine_setup.py -v
      - name: Compile native market-data binary
        run: cargo build --package trading-os-market-data --bin market-data-import --locked
      - name: Native command smoke without database or secrets
        run: target/debug/market-data-import --help

  quality:
    name: Required quality gate
    if: always()
    needs: [python, rust, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success
          test "$MACOS_RESULT" = success
