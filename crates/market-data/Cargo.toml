[package]
name = "trading-os-market-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[[bin]]
name = "market-data-import"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "54"
arrow-schema = "54"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
parquet = { version = "54", features = ["arrow", "zstd"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_decimal = { version = "1.36", features = ["db-postgres", "serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
httpmock = "0.7"
pretty_assertions = "1.4"
tempfile = "3.14"
